; Mini C3 — Waveshare ESP32-C3-Zero + OLED SH1106 1.3"
;
;   First time (USB-C cable):   pio run -e minic3 -t upload
;   From then on (WiFi / OTA):  pio run -e minic3-ota -t upload
;   ...or upload .pio/build/minic3/firmware.bin at http://minic3.local/ota
;
; If you change the OTA password, change it in BOTH places below
; (-D OTA_PASSWORD and --auth).

[platformio]
src_dir = .
default_envs = minic3

[common]
; pioarduino platform: Arduino core 3.3.12
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots: one runs, the other receives the OTA update
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<build/> -<.pio/> -<lib/>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FW_VERSION=\"1.12.0\"
    -D OTA_PASSWORD=\"minic3\"
    ; size: no C++ exceptions (nothing here uses them) and no WiFiManager debug text
    -fno-exceptions
    -D WM_NODEBUG
build_unflags = -fexceptions
; Libraries are bundled in lib/ (fixed versions, builds offline):
;   WiFiManager 2.0.17, ArduinoJson 6.21.6, Adafruit SH110X 2.1.15,
;   Adafruit GFX 1.12.6, Adafruit BusIO 1.17.4, PubSubClient 2.8

[env:minic3]
extends = common
upload_speed = 921600

[env:minic3-ota]
extends = common
upload_protocol = espota
; Use the IP shown on the device (touch A) if minic3.local does not resolve
upload_port = minic3.local
upload_flags =
    --port=3232
    --auth=minic3
